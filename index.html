<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduTrack - Interactive & Animated</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
      tailwind.config = {
          theme: {
              extend: {
                  colors: {
                      maroon: { deep: '#5B1023', royal: '#6D1833', cherry: '#7B1E3C' },
                      chrome: { silver: '#E2E8F0', pearl: '#F8FAFC', light: '#F1F5F9' },
                      accent: { rosegold: '#B76E79', blush: '#F4C2C2', mauve: '#B784A7' },
                      status: { present: '#10B981', absent: '#FB7185', leave: '#C084FC' },
                      text: { dark: '#1E293B', muted: '#64748B' }
                  },
                  fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'], outfit: ['Outfit', 'sans-serif'] }
              }
          }
      }
  </script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    /* Scrollbar */
    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; border-radius: 10px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: rgba(143, 28, 63, 0.3); border-radius: 10px; }
    .custom-scroll::-webkit-scrollbar-thumb:hover { background: rgba(143, 28, 63, 0.5); }
    
    body { background-color: #F8FAFC; color: #1E293B; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-font-smoothing: antialiased; margin: 0; }
    
    /* --- AURORA LUXURY GLASSMORPHISM --- */
    /* Map glass-panel to crystal-glass */
    .glass-panel {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.7), rgba(248, 250, 252, 0.4));
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(226, 232, 240, 0.9);
      box-shadow: 0 20px 40px rgba(30, 41, 59, 0.05), inset 0 1px 2px rgba(255, 255, 255, 1), inset 0 -2px 8px rgba(226, 232, 240, 0.5);
      border-radius: 30px;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }
    .glass-panel::after {
      content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
      background: linear-gradient(to right, transparent, rgba(255,255,255,0.6), transparent);
      transform: skewX(-20deg); transition: 0.7s; pointer-events: none;
    }
    .glass-panel:hover::after { left: 200%; }
    .glass-panel:hover {
      transform: translateY(-4px);
      box-shadow: 0 25px 50px rgba(91, 16, 35, 0.08), inset 0 2px 6px rgba(255, 255, 255, 1), inset 0 -2px 12px rgba(226, 232, 240, 0.8);
      border-color: #FFF;
    }

    /* Map glass-card to maroon-glass styling or slightly different crystal glass */
    .glass-card {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.8), rgba(248, 250, 252, 0.6));
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border-radius: 24px;
      border: 1px solid rgba(226, 232, 240, 1);
      box-shadow: 0 10px 30px rgba(30, 41, 59, 0.04), inset 0 1px 2px rgba(255, 255, 255, 1);
      transition: all 0.3s ease;
    }
    .glass-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(91, 16, 35, 0.06), inset 0 2px 6px rgba(255, 255, 255, 1);
    }

    .glass-nav {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.75), rgba(248, 250, 252, 0.65));
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-bottom: 1px solid rgba(226, 232, 240, 0.9);
      box-shadow: 0 4px 20px rgba(30, 41, 59, 0.03);
    }

    /* Map glass-input to the new input style */
    .glass-input {
      background: rgba(255, 255, 255, 0.6) !important;
      backdrop-filter: blur(16px) !important;
      border: 1px solid rgba(226, 232, 240, 0.8) !important;
      border-radius: 9999px !important;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.02) !important;
      transition: all 0.3s ease !important;
      color: #1E293B !important;
      font-weight: 600 !important;
    }
    .glass-input:focus {
      background: rgba(255, 255, 255, 0.95) !important;
      border-color: #7B1E3C !important;
      box-shadow: 0 0 0 4px rgba(123, 30, 60, 0.1), inset 0 2px 4px rgba(0,0,0,0.02) !important;
      outline: none !important;
    }
    .glass-input::placeholder { color: #64748B !important; font-weight: 500; opacity: 0.8; }

    .glass-dropdown {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.8), rgba(248, 250, 252, 0.6));
      backdrop-filter: blur(40px);
      border-radius: 24px;
      border: 1px solid rgba(226, 232, 240, 0.9);
      box-shadow: 0 25px 50px rgba(30, 41, 59, 0.1);
    }
    
    /* Buttons - Map to Jelly buttons */
    .btn-contrast {
      position: relative;
      background: linear-gradient(135deg, #7B1E3C, #5B1023);
      border-radius: 9999px;
      border: 1px solid rgba(226, 232, 240, 0.6);
      color: white;
      font-weight: 600;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(91, 16, 35, 0.4), inset 0 -3px 8px rgba(0, 0, 0, 0.2);
      transition: all 0.3s ease;
    }
    .btn-contrast::before {
      content: ''; position: absolute; top: 2px; left: 5%; width: 90%; height: 40%;
      background: linear-gradient(to bottom, rgba(255,255,255,0.4), rgba(255,255,255,0));
      border-radius: 9999px; pointer-events: none;
    }
    .btn-contrast:hover {
      transform: scale(1.02);
      box-shadow: 0 12px 25px rgba(123, 30, 60, 0.5), inset 0 -3px 8px rgba(0, 0, 0, 0.2);
      filter: brightness(1.1);
    }
    .btn-contrast:active {
      transform: scale(0.97);
    }

    .btn-secondary {
      position: relative;
      background: linear-gradient(135deg, #ffffff, #E2E8F0);
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      color: #5B1023;
      font-weight: 700;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05), inset 0 -3px 8px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
    }
    .btn-secondary::before {
      content: ''; position: absolute; top: 2px; left: 5%; width: 90%; height: 40%;
      background: linear-gradient(to bottom, rgba(255,255,255,0.9), rgba(255,255,255,0));
      border-radius: 9999px; pointer-events: none;
    }
    .btn-secondary:hover {
      transform: scale(1.02);
      box-shadow: 0 8px 20px rgba(91, 16, 35, 0.1), inset 0 -3px 8px rgba(0, 0, 0, 0.1);
      filter: brightness(1.05);
    }
    .btn-secondary:active {
      transform: scale(0.96);
    }

    /* Icon Bubbles */
    .icon-pink-bubble {
      background: linear-gradient(135deg, #ff4d6d, #c9184a);
      color: white;
      border: 1px solid #c9184a;
      border-top: 2px solid #ffb3c1;
      box-shadow: 0 6px 15px rgba(201, 24, 74, 0.3), inset 0 3px 6px rgba(255,255,255,0.5);
      border-radius: 20px;
    }

    .icon-glass-bubble {
      background: rgba(255, 255, 255, 0.7);
      color: #5e1026;
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-top: 2px solid rgba(255, 255, 255, 1);
      box-shadow: 0 6px 15px rgba(94, 16, 38, 0.08), inset 0 4px 8px rgba(255, 255, 255, 1);
      border-radius: 20px;
    }

    select option { background: #ffe4e8; color: #5e1026; font-weight: bold; }

    /* --- ANIMATIONS & INTERACTIONS --- */
    @keyframes slideUpFade {
      from { opacity: 0; transform: translateY(30px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes scaleInDropdown {
      from { opacity: 0; transform: scale(0.9) translateY(-10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes fillProgress { 
      from { stroke-dashoffset: 213; } /* 2 * PI * 34 */
    }

    .animate-progress { animation: fillProgress 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-progress-bar { animation: fillProgressBar 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes fillProgressBar { from { width: 0%; } }

    .animate-slide-up { animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
    .animate-dropdown { animation: scaleInDropdown 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; transform-origin: top right; opacity: 0; }
    
    /* Interactive Hover States */
    .interactive-card {
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .interactive-card:hover {
      transform: translateY(-6px);
      background: rgba(255, 255, 255, 0.75);
      box-shadow: 0 20px 40px -10px rgba(94, 16, 38, 0.25), inset 0 6px 12px rgba(255, 255, 255, 1);
      border-color: rgba(255, 255, 255, 0.9);
    }
    
    /* Active Row Hover */
    .interactive-row { transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    .interactive-row:hover { transform: translateX(6px) scale(1.01); background: rgba(255, 255, 255, 0.85) !important; box-shadow: 0 10px 20px rgba(94,16,38,0.1); border-radius: 20px; z-index: 10; position: relative;}

    /* Shimmer Hover Effect */
    .shimmer { position: relative; overflow: hidden; }
    .shimmer::after {
      content: ''; position: absolute; top: 0; left: -150%; width: 50%; height: 100%;
      background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.7) 50%, rgba(255,255,255,0) 100%);
      transform: skewX(-25deg); transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1); z-index: 20; pointer-events: none;
    }
    .shimmer:hover::after { left: 200%; }

    /* Animated Background Orbs */
    @keyframes blob {
      0% { transform: translate(0px, 0px) scale(1); }
      33% { transform: translate(40px, -60px) scale(1.1); }
      66% { transform: translate(-30px, 30px) scale(0.9); }
      100% { transform: translate(0px, 0px) scale(1); }
    }
    .animate-blob { animation: blob 15s infinite alternate cubic-bezier(0.4, 0, 0.2, 1); }

    /* Float Icon */
    @keyframes float-icon {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    .animate-float-icon { animation: float-icon 3s ease-in-out infinite; }

  </style>
</head>
<body class="text-maroon-deep min-h-screen relative overflow-x-hidden bg-[#fafafa]">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const playSound = (type) => {
      const sounds = {
        pop: 'https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3',
        success: 'https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3',
        error: 'https://assets.mixkit.co/active_storage/sfx/2570/2570-preview.mp3'
      };
      if (sounds[type]) {
        const audio = new Audio(sounds[type]);
        audio.volume = 0.4;
        audio.play().catch(e => console.log('Audio error:', e));
      }
    };

    const showPopup = (title, text, icon = 'success') => {
      if(icon === 'success') playSound('success');
      else if(icon === 'error') playSound('error');
      
      Swal.fire({
        title: title,
        text: text,
        icon: icon,
        confirmButtonColor: '#7B1E3C',
        background: 'rgba(255, 255, 255, 0.95)',
        backdrop: 'rgba(91, 16, 35, 0.4)',
        color: '#1E293B',
        customClass: {
          popup: 'rounded-3xl border border-white shadow-2xl backdrop-blur-xl',
          confirmButton: 'rounded-full px-8 py-3 font-black text-[14px] shadow-lg'
        }
      });
    };

    // ----- ICONS -----
    const IconCalendarCheck = () => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="4" rx="4" ry="4"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/><path d="m9 16 2 2 4-4"/></svg>;
    const IconUsers = () => <svg width="22" height="22" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>;
    const IconCalendar = () => <svg width="22" height="22" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="4" ry="4"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>;
    const IconCheckCircle = () => <svg width="22" height="22" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>;
    const IconXCircle = () => <svg width="22" height="22" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>;
    const IconFileText = () => <svg width="22" height="22" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>;
    const IconClock = () => <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>;
    const IconFolder = () => <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>;
    const IconTrash = () => <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>;

    // ----- TOAST -----
    const Toast = ({ message, onClose, type = 'success' }) => {
      useEffect(() => {
        if (!message) return;
        const timer = setTimeout(onClose, 3000);
        return () => clearTimeout(timer);
      }, [message]);
      
      if (!message) return null;
      return (
        <div className={`fixed bottom-8 left-1/2 -translate-x-1/2 text-white px-6 py-3 rounded-full shadow-[0_10px_25px_rgba(201,24,74,0.3)] flex items-center gap-3 z-50 animate-slide-up border-t-2 border-white/60 ${type === 'error' ? 'bg-red-500 backdrop-blur-md' : 'bg-gradient-to-r from-[#ff4d6d] to-[#8f1c3f] backdrop-blur-md'}`}>
          {type === 'error' ? (
            <svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="3" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          ) : (
            <svg width="18" height="18" fill="none" stroke="#fff" strokeWidth="3" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          )}
          <span className="text-[14px] font-black tracking-wide">{message}</span>
        </div>
      );
    };

    // ----- ANIMATED COMPONENTS -----
    const BackgroundGlow = () => (
      <div className="fixed inset-0 z-[-1] overflow-hidden bg-chrome-pearl pointer-events-none">
        <div className="absolute top-[-15%] left-[-10%] w-[60vw] h-[60vw] bg-maroon-deep rounded-full filter blur-[100px] opacity-40 animate-blob"></div>
        <div className="absolute bottom-[-20%] right-[-10%] w-[70vw] h-[70vw] bg-maroon-cherry rounded-full filter blur-[100px] opacity-30 animate-blob" style={{animationDelay: '-5s'}}></div>
        <div className="absolute top-[30%] left-[40%] w-[50vw] h-[50vw] bg-chrome-silver rounded-full filter blur-[100px] opacity-50 animate-blob" style={{animationDelay: '-2s'}}></div>
        <div className="absolute bottom-[10%] left-[10%] w-[40vw] h-[40vw] bg-accent-rosegold rounded-full filter blur-[100px] opacity-20 animate-blob" style={{animationDelay: '-7s'}}></div>
      </div>
    );

    const AnimatedNumber = ({ value, duration = 1500, prefix = '' }) => {
      const [count, setCount] = useState(0);
      const parsedValue = parseInt(value, 10) || 0;
      useEffect(() => {
        if (parsedValue === 0) { setCount(0); return; }
        let startTimestamp = null;
        const step = (timestamp) => {
          if (!startTimestamp) startTimestamp = timestamp;
          const progress = Math.min((timestamp - startTimestamp) / duration, 1);
          const easeProgress = progress === 1 ? 1 : 1 - Math.pow(2, -10 * progress);
          setCount(Math.floor(easeProgress * parsedValue));
          if (progress < 1) window.requestAnimationFrame(step);
          else setCount(parsedValue);
        };
        window.requestAnimationFrame(step);
      }, [parsedValue, duration]);
      return <span>{prefix}{count}</span>;
    };

    // ----- SHARED NAVBAR -----
    function SharedNavbar({ navLinks, activeTab, setActiveTab, profileName, profileSubtext, onLogout, avatarUrl = null, customDropdownItems = null }) {
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
      const [isProfileOpen, setIsProfileOpen] = useState(false);

      const getInitials = (name) => {
        if(!name) return 'U';
        const parts = name.split(' ');
        if(parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
        return name.substring(0, 2).toUpperCase();
      };

      return (
        <>
          <nav className="flex items-center justify-between px-6 sm:px-8 py-4 glass-nav z-40 relative">
            <div className="flex items-center gap-3">
              <button className="md:hidden p-2 text-maroon-royal hover:text-maroon-cherry hover:-translate-y-0.5 border border-white/60 rounded-xl transition-all bg-white shadow-sm" onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)}>
                <svg width="22" height="22" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
              </button>
              <div className="icon-pink-bubble p-2 flex items-center justify-center group cursor-pointer transition-transform hover:scale-105">
                <div className="group-hover:rotate-12 transition-transform duration-500"><IconCalendarCheck /></div>
              </div>
              <span className="font-black text-[22px] text-maroon-deep hidden sm:block tracking-tight">EduTrack</span>
            </div>
            
            <div className="hidden md:flex items-center gap-8 text-[15px] font-bold text-maroon-royal h-full">
              {navLinks.map(link => (
                <button key={link} onClick={() => { playSound('pop'); setActiveTab(link); }} className={`transition-all duration-300 h-full relative py-2 hover:-translate-y-0.5 ${activeTab === link ? 'text-maroon-cherry font-black' : 'hover:text-maroon-deep'}`}>
                  {link}
                  {activeTab === link && <div className="absolute bottom-[-18px] left-0 w-full h-[4px] bg-maroon-cherry rounded-t-full shadow-[0_-2px_6px_rgba(255,77,109,0.3)] animate-slide-up" style={{animationDuration: '0.3s'}}></div>}
                </button>
              ))}
            </div>

            <div className="flex items-center gap-4">
              <div className="relative">
                <div className="cursor-pointer transition-all duration-300 hover:scale-110 hover:-rotate-3" onClick={() => setIsProfileOpen(!isProfileOpen)}>
                  {avatarUrl ? (
                    <img src={avatarUrl} className="w-12 h-12 rounded-[18px] object-cover border-[3px] border-white shadow-[0_4px_10px_rgba(94,16,38,0.2)]" alt="Profile" />
                  ) : (
                    <div className="w-12 h-12 icon-glass-bubble font-black text-[16px] flex items-center justify-center border-[3px] border-white shadow-[0_4px_10px_rgba(94,16,38,0.2)]">
                      {getInitials(profileName)}
                    </div>
                  )}
                </div>
                {isProfileOpen && (
                  <div className="absolute right-0 mt-4 w-60 glass-dropdown py-2 animate-dropdown z-50">
                    <div className="px-5 py-4 border-b border-white/60 mb-1">
                      <p className="text-[15px] font-black text-maroon-deep truncate">{profileName}</p>
                      <p className="text-[13px] font-bold text-maroon-royal truncate mt-1">{profileSubtext}</p>
                    </div>
                    {customDropdownItems}
                    <button onClick={() => { playSound('pop'); onLogout(); }} className="w-full text-left px-5 py-3 text-[14px] text-white bg-maroon-cherry hover:bg-[#c9184a] flex items-center gap-2 font-black transition-colors rounded-b-2xl"><svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="3" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Logout</button>
                  </div>
                )}
              </div>
            </div>
          </nav>
          {isMobileMenuOpen && (
            <div className="md:hidden glass-dropdown border-b border-white/60 px-5 py-4 animate-dropdown absolute w-full z-30 shadow-2xl top-full mt-2 origin-top">
              {navLinks.map((link, idx) => (
                <button key={link} onClick={() => { playSound('pop'); setActiveTab(link); setIsMobileMenuOpen(false); }} className={`block w-full text-left py-3.5 px-5 rounded-2xl text-[15px] font-black mb-2 transition-all animate-slide-up hover:-translate-y-0.5 ${activeTab === link ? 'bg-white text-maroon-cherry shadow-sm border border-white' : 'text-maroon-royal hover:bg-white/60 border border-transparent'}`} style={{animationDelay: `${idx*0.05}s`}}>
                  {link}
                </button>
              ))}
            </div>

    // ----- LOGIN SCREEN -----

      const [role, setRole] = useState('Student');

      const roles = [
        { name: 'Student', icon: <svg className="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg> },
        { name: 'Teacher', icon: <svg className="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><rect width="20" height="14" x="2" y="3" rx="4"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg> },
        { name: 'Admin', icon: <svg className="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/><path d="m9 12 2 2 4-4"/></svg> }
      ];

      const handleLogin = (e) => {
        e.preventDefault();
        setError('');
        const roleKey = role.toLowerCase();
        const storedCreds = credentials[roleKey];
        const inputUser = username.trim();
        const savedUser = storedCreds.username.trim();
        const fallbackAdminUser = savedUser === '.\\admin' ? 'admin' : savedUser;

        if ((inputUser === savedUser || inputUser === fallbackAdminUser) && password === storedCreds.password) {
          playSound('success');
          onLoginSuccess(roleKey);
        } else {
          playSound('error');
          setError(`Invalid username or password for ${role}.`);
        }
      };

      return (
        <div className="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
          <div className="glass-panel w-full max-w-[420px] p-8 sm:p-10 animate-slide-up relative z-10">
            <div className="flex flex-col items-center mb-10">
              <div className="flex items-center gap-4 mb-6 hover:scale-105 transition-transform duration-300">
                <div className="icon-pink-bubble p-3"><IconCalendarCheck /></div>
                <h1 className="text-[32px] font-black text-maroon-deep tracking-tight">EduTrack</h1>
              </div>
              <h2 className="text-[22px] font-black text-maroon-deep mb-2 text-center">Welcome back ✨</h2>
              <p className="text-[14.5px] text-maroon-royal text-center font-bold">Sign in to your account</p>
            </div>
            
            <div className="flex w-full bg-white/40 p-1.5 rounded-[20px] mb-8 relative border border-white/60 shadow-inner">
              {roles.map((r) => (
                <button key={r.name} type="button" onClick={() => { setRole(r.name); setError(''); setUsername(''); setPassword(''); }} className={`flex-1 flex justify-center items-center gap-2 py-3 text-[14px] font-black transition-all duration-300 rounded-[16px] ${role === r.name ? 'bg-white text-maroon-cherry shadow-sm scale-100' : 'text-maroon-royal hover:text-maroon-deep hover:bg-white/50 scale-95'}`}>
                  {r.icon} {r.name}
                </button>
              ))}
            </div>

            <form onSubmit={handleLogin}>
              {error && <div className="mb-6 p-4 bg-red-100 border-2 border-red-300 text-red-600 text-[13.5px] rounded-2xl text-center font-black shadow-sm animate-slide-up">{error}</div>}
              
              <div className="mb-6">
                <label className="block text-[14px] font-black text-maroon-royal mb-2 transition-colors">Username / ID</label>
                <div className="relative group">
                  <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-maroon-royal group-focus-within:text-maroon-cherry group-focus-within:scale-110 transition-all duration-300">
                    <svg className="w-[20px] h-[20px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                  </div>
                  <input type="text" value={username} onChange={(e) => setUsername(e.target.value)} className="w-full pl-12 pr-4 py-3.5 glass-input text-[15px]" placeholder="Enter your ID" required />
                </div>
              </div>

              <div className="mb-8">
                <label className="block text-[14px] font-black text-maroon-royal mb-2">Password</label>
                <div className="relative group">
                  <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-maroon-royal group-focus-within:text-maroon-cherry group-focus-within:scale-110 transition-all duration-300">
                    <svg className="w-[20px] h-[20px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><rect width="18" height="11" x="3" y="11" rx="4" ry="4"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                  </div>
                  <input type={showPassword ? "text" : "password"} value={password} onChange={(e) => setPassword(e.target.value)} className="w-full pl-12 pr-12 py-3.5 glass-input text-[15px] tracking-wider" placeholder="••••••••" required />
                  <button type="button" className="absolute inset-y-0 right-0 pr-4 flex items-center text-maroon-royal hover:text-maroon-cherry hover:scale-110 transition-all duration-300" onClick={() => setShowPassword(!showPassword)}>
                    {showPassword ? <svg className="w-[20px] h-[20px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg> : <svg className="w-[20px] h-[20px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>}
                  </button>
                </div>
              </div>
              <button type="submit" className="w-full btn-contrast font-black py-4 mt-2 flex justify-center items-center text-[15px] group">
                Sign In 
                <svg className="ml-2 w-[20px] h-[20px] group-hover:translate-x-1 transition-transform duration-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" x2="3" y1="12" y2="12"/></svg>
              </button>
            </form>
          </div>
        </div>
      );
    }

    // ----- STUDENT DASHBOARD COMPONENTS -----
    const CircularProgress = ({ percentage }) => {
      const radius = 34; const circumference = 2 * Math.PI * radius; const offset = circumference - (percentage / 100) * circumference;
      return (
        <div className="relative w-[90px] h-[90px] flex items-center justify-center flex-shrink-0 group">
          <svg className="transform -rotate-90 w-full h-full drop-shadow-[0_4px_10px_rgba(255,77,109,0.3)] group-hover:scale-105 transition-transform duration-500" viewBox="0 0 100 100">
            <defs><linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stopColor="#ff4d6d" /><stop offset="100%" stopColor="#5e1026" /></linearGradient></defs>
            <circle cx="50" cy="50" r={radius} stroke="rgba(255,255,255,0.7)" strokeWidth="8" fill="none" />
            <circle cx="50" cy="50" r={radius} stroke="url(#circleGrad)" strokeWidth="8" fill="none" strokeDasharray={circumference} strokeDashoffset={offset} strokeLinecap="round" className="animate-progress" />
          </svg>
          <span className="absolute text-[22px] font-black text-maroon-deep group-hover:scale-110 transition-transform duration-300">{percentage}%</span>
        </div>
      );
    };

    const getSubjectUI = () => {
      return {
        icon: <svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      };
    };

    function StudentDashboard({ onLogout, globalData }) {
      const [profileData, setProfileData] = useState(() => {
        try { const saved = localStorage.getItem('attendify_student_v6'); if (saved) return JSON.parse(saved); } catch(e) {}
        return null;
      });

      const [setupStep, setSetupStep] = useState(1);
      const [setupName, setSetupName] = useState('');
      const [setupRoll, setSetupRoll] = useState('');
      const [setupSem, setSetupSem] = useState(''); 
      const [setupSubjects, setSetupSubjects] = useState([]);

      const handleNextStep = () => {
        if(!setupName.trim() || !setupRoll.trim() || !setupSem) return alert("Please fill in your Name, Roll No, and select a Semester.");
        setSetupStep(2);
      };

      const toggleSetupSubject = (subId, subName) => {
        if(setupSubjects.find(s => s.id === subId)) setSetupSubjects(setupSubjects.filter(s => s.id !== subId));
        else setSetupSubjects([...setupSubjects, { id: subId, name: subName, present: 0, total: 0 }]);
      };

      const updateSubjectStats = (id, field, value) => {
        const num = parseInt(value) || 0;
        setSetupSubjects(prev => prev.map(s => {
          if(s.id === id) { const updated = { ...s, [field]: num }; if(updated.present > updated.total) updated.present = updated.total; return updated; }
          return s;
        }));
      };

      const handleSetupComplete = () => {
        if(setupSubjects.length < 4) return alert(`Please select at least 4 subjects!`);
        let globalPresent = 0, globalTotal = 0;
        setupSubjects.forEach(s => { globalPresent += s.present; globalTotal += s.total; });
        const newProfile = {
          name: setupName, rollNo: setupRoll, semester: setupSem,
          stats: { present: globalPresent, absent: globalTotal - globalPresent, total: globalTotal },
          subjects: setupSubjects,
          activities: [ { id: Date.now(), title: 'Profile initialized successfully' } ]
        };
        setProfileData(newProfile);
        localStorage.setItem('attendify_student_v6', JSON.stringify(newProfile));
      };

      const [toastMsg, setToastMsg] = useState('');
      const [activeTab, setActiveTab] = useState('Dashboard');

      if (!profileData) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 relative">
            <div className="glass-panel w-full max-w-[500px] p-8 sm:p-10 animate-slide-up relative z-10">
              {setupStep === 1 && (
                <div className="animate-slide-up">
                  <div className="text-center mb-8">
                    <div className="icon-pink-bubble p-4 inline-block mb-5 hover:rotate-12 hover:scale-110 transition-all duration-300"><IconCalendarCheck /></div>
                    <h2 className="text-[26px] font-black text-maroon-deep">Student Setup</h2>
                    <p className="text-[14.5px] font-bold text-maroon-royal mt-1">Please enter your basic details</p>
                  </div>
                  <div className="space-y-5">
                    <div className="animate-slide-up" style={{animationDelay: '0.1s'}}>
                      <label className="block text-[14px] font-black text-maroon-royal mb-2">Full Name</label>
                      <input type="text" value={setupName} onChange={e=>setSetupName(e.target.value)} placeholder="e.g. Rahul Shah" className="w-full px-5 py-3 glass-input" />
                    </div>
                    <div className="animate-slide-up" style={{animationDelay: '0.2s'}}>
                      <label className="block text-[14px] font-black text-maroon-royal mb-2">Roll No</label>
                      <input type="text" value={setupRoll} onChange={e=>setSetupRoll(e.target.value)} placeholder="e.g. 101" className="w-full px-5 py-3 glass-input" />
                    </div>
                    <div className="animate-slide-up" style={{animationDelay: '0.3s'}}>
                      <label className="block text-[14px] font-black text-maroon-royal mb-2">Semester</label>
                      <select value={setupSem} onChange={e=>setSetupSem(e.target.value)} className="w-full px-5 py-3 glass-input cursor-pointer">
                        <option value="" disabled>-- Select Semester --</option>
                        <option value="1">Semester 1</option><option value="2">Semester 2</option><option value="3">Semester 3</option><option value="4">Semester 4</option><option value="5">Semester 5</option>
                      </select>
                    </div>
                  </div>
                  <button onClick={handleNextStep} className="w-full btn-contrast font-black py-4 mt-8 flex justify-center items-center text-[15px] animate-slide-up group" style={{animationDelay: '0.4s'}}>
                    Continue <svg className="ml-2 w-[20px] h-[20px] group-hover:translate-x-1 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                  </button>
                </div>
              )}

              {setupStep === 2 && (
                <div className="animate-slide-up">
                  <div className="text-center mb-6">
                    <h2 className="text-[24px] font-black text-maroon-deep">Select Subjects</h2>
                    <p className="text-[14.5px] font-bold text-maroon-royal mt-1">Semester {setupSem} • Select at least 4</p>
                  </div>
                  <div className="bg-white/60 border-2 border-white/90 p-3 rounded-2xl mb-6 text-center text-[14px] font-black text-maroon-cherry shadow-sm animate-slide-up" style={{animationDelay: '0.1s'}}>Selected: {setupSubjects.length} subjects</div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 max-h-[350px] overflow-y-auto custom-scroll pr-2 mb-6">
                    {(globalData.semesterSubjects[setupSem] || []).map((subName, idx) => {
                      const subId = subName.toLowerCase().replace(/[^a-z0-9]/g, '_');
                      const sel = setupSubjects.find(s => s.id === subId);
                      const ui = getSubjectUI();
                      return (
                        <div key={subId} className={`interactive-card animate-slide-up p-4 rounded-[20px] border-[2px] ${sel ? 'border-maroon-cherry bg-white/80 shadow-[0_4px_15px_rgba(255,77,109,0.2)]' : 'border-white/70 bg-white/50 shadow-sm'}`} style={{animationDelay: `${0.1 + (idx*0.05)}s`}}>
                          <div onClick={() => toggleSetupSubject(subId, subName)} className="flex items-center gap-3 cursor-pointer group">
                            <div className={`w-10 h-10 flex items-center justify-center flex-shrink-0 transition-transform group-hover:scale-110 ${sel ? 'icon-pink-bubble' : 'icon-glass-bubble'}`}>{ui.icon}</div>
                            <span className={`text-[13.5px] font-black leading-tight ${sel ? 'text-maroon-cherry' : 'text-maroon-royal'}`}>{subName}</span>
                          </div>
                          {sel && (
                            <div className="mt-4 pt-4 border-t-2 border-white/80 flex gap-3 animate-slide-up" style={{animationDuration: '0.3s'}}>
                              <div className="flex-1"><label className="block text-[12px] text-maroon-cherry font-black mb-1.5">Present</label><input type="number" min="0" value={sel.present} onChange={e => updateSubjectStats(subId, 'present', e.target.value)} className="w-full text-[14px] p-2.5 glass-input" /></div>
                              <div className="flex-1"><label className="block text-[12px] text-maroon-cherry font-black mb-1.5">Total</label><input type="number" min="0" value={sel.total} onChange={e => updateSubjectStats(subId, 'total', e.target.value)} className="w-full text-[14px] p-2.5 glass-input" /></div>
                            </div>
                          )}
                        </div>
                      )
                    })}
                  </div>
                  <div className="flex gap-4 mt-6 animate-slide-up" style={{animationDelay: '0.4s'}}>
                    <button onClick={() => setSetupStep(1)} className="w-1/3 py-4 btn-secondary text-[15px]">Back</button>
                    <button onClick={handleSetupComplete} className="w-2/3 py-4 btn-contrast font-black text-[15px]">Build Dashboard</button>
                  </div>
                </div>
              )}
            </div>
          </div>
        );
      }

      const getOverallPercentage = () => (profileData && profileData.stats && profileData.stats.total !== 0) ? Math.round((profileData.stats.present / profileData.stats.total) * 100) : 0;
      const getSubjectPercentage = (sub) => sub.total === 0 ? 0 : Math.round((sub.present / sub.total) * 100);

      const renderDashboardContent = () => {
        if (activeTab === 'Dashboard') {
          return (
            <div>
              <div className="mb-8 pb-3 border-b-2 border-white/60 animate-slide-up" style={{animationDelay: '0s'}}>
                <h1 className="text-3xl sm:text-[32px] font-black text-maroon-deep flex items-center gap-3 mb-2 tracking-tight">Welcome back, {profileData.name.split(' ')[0]} ✨</h1>
                <p className="text-[15px] font-bold text-maroon-royal">Stay updated with your attendance and academic progress.</p>
              </div>

              <div className="grid grid-cols-2 md:grid-cols-4 gap-5 mb-8">
                {[
                  { label: 'Student Name', value: profileData.name },
                  { label: 'Roll No.', value: `#${profileData.rollNo}`, badge: true },
                  { label: 'Semester', value: profileData.semester, animated: true },
                  { label: 'Subjects', value: profileData.subjects.length, animated: true }
                ].map((stat, idx) => (
                  <div key={idx} className="glass-card p-6 flex flex-col justify-center items-center interactive-card shimmer animate-slide-up" style={{ animationDelay: `${0.1 + (idx*0.1)}s` }}>
                    <p className="text-[12px] font-black text-maroon-royal mb-2 uppercase tracking-wider">{stat.label}</p>
                    {stat.badge ? (
                       <p className="font-black text-[18px] text-white bg-gradient-to-r from-maroon-deep to-maroon-cherry px-4 py-1 rounded-xl shadow-sm">{stat.value}</p>
                    ) : (
                       <p className={`font-black text-maroon-deep truncate w-full text-center ${idx===0 ? 'text-[17px]' : 'text-[22px] leading-none'}`}>
                         {stat.animated ? <AnimatedNumber value={stat.value} /> : stat.value}
                       </p>
                    )}
                  </div>
                ))}
              </div>

              <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div className="flex flex-col gap-6">
                  <div>
                    <h3 className="text-[17px] font-black text-maroon-deep mb-5 flex items-center gap-3 animate-slide-up" style={{animationDelay: '0.3s'}}><div className="w-3 h-3 rounded-full bg-maroon-cherry shadow-[0_0_8px_#ffb3c1] animate-pulse"></div> Your Subjects</h3>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                      {profileData.subjects.map((sub, idx) => {
                        const pct = getSubjectPercentage(sub);
                        return (
                          <div key={sub.id} className="glass-card p-5 interactive-card shimmer animate-slide-up group" style={{ animationDelay: `${0.4 + (idx * 0.1)}s` }}>
                            <div className="flex justify-between items-start mb-5">
                              <div className="flex items-center gap-3"><div className="w-10 h-10 icon-glass-bubble flex items-center justify-center group-hover:scale-110 transition-transform">{getSubjectUI().icon}</div><span className="font-black text-[14px] text-maroon-deep leading-tight pr-2">{sub.name}</span></div>
                              <span className="font-black text-[15px] text-white bg-gradient-to-r from-maroon-deep to-maroon-cherry px-3 py-1 rounded-xl shadow-sm border border-[#ff758f] group-hover:scale-105 transition-transform">{pct}%</span>
                            </div>
                            <div className="w-full bg-white/80 h-[8px] rounded-full overflow-hidden relative border border-white/90 shadow-inner"><div className={`h-full rounded-full absolute left-0 top-0 animate-progress-bar ${pct < 75 && sub.total > 0 ? 'bg-red-500' : 'bg-gradient-to-r from-[#ff4d6d] to-[#5e1026] shadow-[0_0_10px_rgba(255,77,109,0.5)]'}`} style={{ width: `${pct}%` }}></div></div>
                            <div className="mt-3 text-[12px] text-maroon-royal font-black text-right">{sub.present} / {sub.total} classes</div>
                          </div>
                        )
                      })}
                    </div>
                  </div>
                </div>
                <div className="flex flex-col gap-8">
                  <div className="glass-card p-8 flex flex-col sm:flex-row items-center sm:items-start gap-8 interactive-card animate-slide-up" style={{ animationDelay: '0.4s' }}>
                    <CircularProgress percentage={getOverallPercentage()} />
                    <div className="flex-1 text-center sm:text-left w-full mt-2">
                      <h3 className="text-[16px] font-black text-maroon-deep mb-3 uppercase tracking-wide">Overall Overview</h3>
                      <div className="flex flex-wrap justify-center sm:justify-start gap-5 text-[14px] mb-5">
                        <span className="text-maroon-royal font-bold">Present: <strong className="text-maroon-cherry font-black text-[16px]">{profileData.stats.present}</strong></span>
                        <span className="text-maroon-royal font-bold">Absent: <strong className="text-maroon-cherry font-black text-[16px]">{profileData.stats.absent}</strong></span>
                        <span className="text-maroon-royal font-bold">Total: <strong className="text-maroon-cherry font-black text-[16px]">{profileData.stats.total}</strong></span>

                        {profileData.stats.total === 0 ? 'No attendance records yet.' : getOverallPercentage() >= 75 ? 'Great! Your attendance is above the required percentage.' : 'Warning: Your attendance is below 75%. Improve to avoid issues.'}
                      </div>
                    </div>
                  </div>
                  <div>
                    <h3 className="text-[17px] font-black text-maroon-deep mb-5 flex items-center gap-3 animate-slide-up" style={{animationDelay: '0.5s'}}><div className="w-3 h-3 rounded-full bg-maroon-cherry shadow-[0_0_8px_rgba(255,77,109,0.5)] animate-pulse"></div> Today's Schedule</h3>
                    <div className="glass-card p-6 animate-slide-up" style={{animationDelay: '0.6s'}}>
                      <ul className="space-y-5 max-h-[160px] min-h-[160px] overflow-y-auto custom-scroll pr-3 relative z-10">
                        {(() => {
                           const todayClasses = globalData.timetable || [];
                           
                           if (todayClasses.length === 0) {
                             return <li className="text-text-muted font-bold text-[14px]">No classes scheduled for today. Enjoy your day!</li>;
                           }

                           return todayClasses.map((cls, index) => (
                             <li key={cls.id} className="flex items-start gap-4 animate-slide-up group cursor-default" style={{ animationDelay: `${0.6 + (index * 0.1)}s` }}>
                               <div className="w-8 h-8 flex-shrink-0 flex items-center justify-center group-hover:scale-110 transition-transform icon-glass-bubble rounded-full"><IconClock /></div>
                               <div>
                                 <span className="block text-[15px] font-black text-maroon-deep leading-tight group-hover:text-maroon-cherry transition-colors">{cls.subject}</span>
                                 <span className="block text-[13px] font-bold text-maroon-royal mt-1">{cls.startTime} - {cls.endTime}</span>
                               </div>
                             </li>
                           ));
                        })()}
                      </ul>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          );
        }

        if (activeTab === 'Attendance') {
          return (
            <div>
              <div className="mb-8 border-b-2 border-white/60 pb-5 animate-slide-up">
                <h2 className="text-[24px] font-black text-maroon-deep tracking-tight">Detailed Attendance View</h2>
              </div>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                {profileData.subjects.map((sub, idx) => {
                  const pct = getSubjectPercentage(sub);
                  return (

    }

    // ----- ADMIN DASHBOARD -----
    function AdminDashboard({ onLogout, credentials, onUpdateCredentials, globalData, onUpdateGlobalData }) {
      const [localCreds, setLocalCreds] = useState(credentials);
      const [savedMessage, setSavedMessage] = useState('');
      const [activeTab, setActiveTab] = useState('Manage Subjects');

      const [tName, setTName] = useState(globalData.teacherProfile.name);
      const [tDept, setTDept] = useState(globalData.teacherProfile.department);
      const [tSubs, setTSubs] = useState(globalData.teacherProfile.assignedSubjects);

      const [selectedSem, setSelectedSem] = useState('1');
      const [newSubject, setNewSubject] = useState('');

      const [localTimetable, setLocalTimetable] = useState(globalData.timetable || []);
      const allSubjects = Object.values(globalData.semesterSubjects || {}).flat();
      const [ttSubject, setTtSubject] = useState(allSubjects[0] || '');
      const [ttStart, setTtStart] = useState('10:00 AM');
      const [ttEnd, setTtEnd] = useState('11:00 AM');

      const handleChange = (role, field, value) => setLocalCreds(prev => ({ ...prev, [role]: { ...prev[role], [field]: value } }));
      
      const handleSaveCreds = () => { 
        onUpdateCredentials(localCreds); 
        showPopup('Saved!', 'Credentials updated successfully!'); 
      };
      
      const handleSaveTeacher = () => {
        const updated = { ...globalData, teacherProfile: { name: tName, department: tDept, assignedSubjects: tSubs } };
        onUpdateGlobalData(updated);
        showPopup('Updated!', 'Teacher profile updated globally!');
      };

      const handleAddSubject = () => {
        if(!newSubject.trim()) return;
        const updated = { ...globalData };
        if(!updated.semesterSubjects[selectedSem]) updated.semesterSubjects[selectedSem] = [];
        updated.semesterSubjects[selectedSem].push(newSubject.trim());
        onUpdateGlobalData(updated);
        setNewSubject('');
        showPopup('Added!', 'Subject added successfully!');
      };

      const handleRemoveSubject = (sub) => {
        const updated = { ...globalData };
        updated.semesterSubjects[selectedSem] = updated.semesterSubjects[selectedSem].filter(s => s !== sub);
        updated.teacherProfile.assignedSubjects = updated.teacherProfile.assignedSubjects.filter(s => s !== sub);
        setTSubs(updated.teacherProfile.assignedSubjects);
        onUpdateGlobalData(updated);
        showPopup('Removed!', 'Subject removed globally!');
      };

      const addLecture = () => {
        if(!ttSubject || !ttStart || !ttEnd) return;
        const newEntry = { id: Date.now(), subject: ttSubject, startTime: ttStart, endTime: ttEnd };
        setLocalTimetable([...localTimetable, newEntry]);
      };

      const deleteLecture = (id) => {
        setLocalTimetable(localTimetable.filter(t => t.id !== id));
      };

      const saveTimetable = () => {
        onUpdateGlobalData({ ...globalData, timetable: localTimetable });
        showPopup('Published!', 'Timetable published to all dashboards!');
      };
      
      const renderContent = () => {
        if (activeTab === 'Credentials') {
          return (
            <div className="w-full max-w-[800px] mx-auto">
              <div className="mb-8 border-b-2 border-white/60 pb-5 flex items-center gap-4 animate-slide-up">
                <div className="icon-pink-bubble p-3"><svg width="22" height="22" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/><path d="m9 12 2 2 4-4"/></svg></div>
                <div><h1 className="text-[24px] font-black text-maroon-deep tracking-tight">Manage Credentials</h1><p className="text-[14px] font-bold text-maroon-royal">Update system login IDs and passwords</p></div>
              </div>
              <div className="glass-card p-8 relative animate-slide-up" style={{animationDelay: '0.1s'}}>
                {savedMessage && <div className="mb-6 p-4 bg-emerald-100 border-2 border-emerald-300 text-emerald-700 rounded-2xl text-[14px] font-black shadow-sm animate-slide-up">{savedMessage}</div>}
                <div className="grid gap-6">
                  {['student', 'teacher', 'admin'].map((roleName, idx) => (
                    <div key={roleName} className="glass-panel p-6 border-white/80 interactive-card animate-slide-up" style={{animationDelay: `${0.1 + (idx*0.1)}s`}}>
                      <h2 className="text-[13px] font-black uppercase tracking-wider text-maroon-deep mb-5 flex items-center gap-3"><div className="w-2.5 h-2.5 rounded-full bg-maroon-cherry shadow-[0_0_8px_rgba(255,77,109,0.5)]"></div>{roleName} Access</h2>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                        <div><label className="block text-[13px] font-black text-maroon-royal mb-2">Username</label><input type="text" value={localCreds[roleName].username} onChange={(e) => handleChange(roleName, 'username', e.target.value)} className="w-full px-5 py-3 glass-input text-[14px]" /></div>
                        <div><label className="block text-[13px] font-black text-maroon-royal mb-2">Password</label><input type="text" value={localCreds[roleName].password} onChange={(e) => handleChange(roleName, 'password', e.target.value)} className="w-full px-5 py-3 glass-input text-[14px]" /></div>
                      </div>
                    </div>
                  ))}
                </div>
                <div className="mt-8 flex justify-end pt-6 border-t-2 border-white/60 animate-slide-up" style={{animationDelay: '0.5s'}}>
                  <button onClick={handleSaveCreds} className="btn-contrast px-8 py-3 font-black text-[14px]">Save Changes</button>
                </div>
              </div>

              {/* TIMETABLE SECTION */}
              <div className="mt-12 mb-8 border-b-2 border-white/60 pb-5 flex items-center gap-4 animate-slide-up">
                <div className="icon-pink-bubble p-3"><IconCalendar /></div>
                <div><h1 className="text-[24px] font-black text-maroon-deep tracking-tight">Daily Timetable</h1><p className="text-[14px] font-bold text-maroon-royal">Schedule lectures for today</p></div>
              </div>
              
              <div className="glass-card p-8 relative animate-slide-up" style={{animationDelay: '0.2s'}}>
                <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                  <select className="glass-input px-4 py-3 md:col-span-2" value={ttSubject} onChange={e=>setTtSubject(e.target.value)}>
                    {allSubjects.map((s, idx) => <option key={idx} value={s}>{s}</option>)}
                  </select>
                  <input type="text" placeholder="Start (e.g. 10:00 AM)" className="glass-input px-4 py-3" value={ttStart} onChange={e=>setTtStart(e.target.value)} />
                  <input type="text" placeholder="End (e.g. 11:00 AM)" className="glass-input px-4 py-3" value={ttEnd} onChange={e=>setTtEnd(e.target.value)} />
                </div>
                <div className="flex justify-end mb-8">
                  <button onClick={addLecture} className="btn-secondary px-8 py-3 font-black text-[14px]">Add to Draft</button>
                </div>

                <h3 className="text-[16px] font-black text-maroon-deep mb-4 border-t-2 border-white/60 pt-6">Today's Schedule (Draft)</h3>
                {localTimetable.length === 0 ? <p className="text-[14px] font-bold text-maroon-royal">No lectures scheduled for today.</p> : (
                  <div className="space-y-4 mb-6">
                    {localTimetable.map((tt, idx) => (
                      <div key={tt.id} className="p-4 border border-white/60 rounded-2xl flex items-center justify-between bg-white/40 animate-slide-up interactive-card" style={{animationDelay: `${idx*0.1}s`}}>
                        <div>
                          <p className="font-black text-maroon-deep text-[16px]">{tt.subject}</p>
                          <p className="text-[13px] font-bold text-maroon-royal mt-1 flex items-center gap-2"><IconClock /> {tt.startTime} - {tt.endTime}</p>
                        </div>
                        <button onClick={() => deleteLecture(tt.id)} className="p-2 text-red-500 hover:bg-white rounded-xl transition-colors"><IconTrash /></button>
                      </div>
                    ))}
                  </div>
                )}
                <div className="flex justify-end pt-5 border-t-2 border-white/60 mt-4">
                  <button onClick={saveTimetable} className="btn-contrast px-8 py-3 font-black text-[14px]">Save & Publish Timetable</button>
                </div>
              </div>
            </div>
          );
        }

        if (activeTab === 'Manage Subjects') {
          const currentSubjects = globalData.semesterSubjects[selectedSem] || [];
          return (
            <div className="w-full max-w-[800px] mx-auto">
               <div className="mb-8 border-b-2 border-white/60 pb-5 flex items-center gap-4 animate-slide-up">
                <div className="icon-pink-bubble p-3"><IconFolder /></div>
                <div><h1 className="text-[24px] font-black text-maroon-deep tracking-tight">Global Subject Management</h1><p className="text-[14px] font-bold text-maroon-royal">Changes affect what students see during setup</p></div>
              </div>
               <div className="glass-card p-8 animate-slide-up" style={{animationDelay: '0.1s'}}>
                 {savedMessage && <div className="mb-6 p-4 bg-emerald-100 border-2 border-emerald-300 text-emerald-700 rounded-2xl text-[14px] font-black shadow-sm animate-slide-up">{savedMessage}</div>}
                 
                 <div className="mb-8 p-6 glass-panel border-white/80 interactive-card">
                   <label className="block text-[13px] font-black text-maroon-royal mb-3 uppercase tracking-wide">Select Semester to Edit</label>
                   <select value={selectedSem} onChange={e=>setSelectedSem(e.target.value)} className="w-full sm:w-1/2 px-5 py-3 glass-input text-[14px] cursor-pointer">
                     <option value="1">Semester 1</option><option value="2">Semester 2</option><option value="3">Semester 3</option><option value="4">Semester 4</option><option value="5">Semester 5</option>
                   </select>
                 </div>
                 
                 <div className="mb-8 animate-slide-up" style={{animationDelay: '0.2s'}}>
                   <h3 className="text-[14px] font-black text-maroon-deep mb-4 flex items-center justify-between uppercase tracking-wide">
                      Subjects for Semester {selectedSem}
                      <span className="bg-white/90 text-maroon-cherry px-4 py-1.5 rounded-xl text-[12px] font-black shadow-sm border border-white hover:scale-105 transition-transform">{currentSubjects.length} subjects</span>
                   </h3>
                   <div className="flex flex-wrap gap-3">
                     {currentSubjects.length === 0 ? <span className="text-[14px] font-bold text-maroon-royal">No subjects found for this semester.</span> : currentSubjects.map((sub, idx) => (
                       <div key={sub} className="bg-white px-4 py-2 rounded-[16px] text-maroon-deep text-[14px] font-black flex items-center gap-3 hover:-translate-y-1 transition-all animate-slide-up shadow-sm border border-white/80" style={{animationDelay: `${0.2 + (idx*0.05)}s`}}>
                         {sub}
                         <button onClick={() => handleRemoveSubject(sub)} className="text-red-500 hover:text-white hover:bg-red-500 p-1.5 rounded-lg transition-colors ml-1 hover:scale-110"><IconTrash /></button>
                       </div>
                     ))}
                   </div>
                 </div>
                 
                 <div className="border-t-2 border-white/60 pt-8 mt-6 animate-slide-up" style={{animationDelay: '0.4s'}}>
                   <label className="block text-[13px] font-black text-maroon-royal mb-3 uppercase tracking-wide">Add New Subject</label>
                   <div className="flex gap-4 flex-col sm:flex-row">
                     <input type="text" value={newSubject} onChange={e=>setNewSubject(e.target.value)} placeholder="e.g. Artificial Intelligence" className="flex-1 px-5 py-3 glass-input text-[14px]" />
                     <button onClick={handleAddSubject} className="btn-contrast px-8 py-3 font-black text-[14px] whitespace-nowrap">Add Subject</button>
                   </div>
                 </div>
               </div>
            </div>
          )
        }

        if (activeTab === 'Manage Teacher') {
          const allSubjects = Array.from(new Set(Object.values(globalData.semesterSubjects).flat()));
          return (
            <div className="w-full max-w-[800px] mx-auto">
               <div className="mb-8 border-b-2 border-white/60 pb-5 flex items-center gap-4 animate-slide-up">
                <div className="icon-pink-bubble p-3"><IconUsers /></div>
                <div><h1 className="text-[24px] font-black text-maroon-deep tracking-tight">Manage Teacher Profile</h1><p className="text-[14px] font-bold text-maroon-royal">Assign subjects and update teacher details</p></div>
              </div>
               <div className="glass-card p-8 relative animate-slide-up" style={{animationDelay: '0.1s'}}>
                 {savedMessage && <div className="mb-6 p-4 bg-emerald-100 border-2 border-emerald-300 text-emerald-700 rounded-2xl text-[14px] font-black shadow-sm animate-slide-up">{savedMessage}</div>}
                 
                 <div className="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-8">
                   <div className="animate-slide-up" style={{animationDelay: '0.2s'}}>
                     <label className="block text-[13px] font-black text-maroon-royal mb-2 uppercase tracking-wide">Teacher Name</label>
                     <input value={tName} onChange={e=>setTName(e.target.value)} className="w-full px-5 py-3 glass-input text-[14px]" />
                   </div>
                   <div className="animate-slide-up" style={{animationDelay: '0.3s'}}>
                     <label className="block text-[13px] font-black text-maroon-royal mb-2 uppercase tracking-wide">Department</label>
                     <input value={tDept} onChange={e=>setTDept(e.target.value)} className="w-full px-5 py-3 glass-input text-[14px]" />
                   </div>
                 </div>
                 
                 <div className="mb-8 animate-slide-up" style={{animationDelay: '0.4s'}}>
                   <h3 className="text-[14px] font-black text-maroon-deep mb-4 flex items-center justify-between uppercase tracking-wide">
                     Assign Subjects
                     <span className="bg-white/90 text-maroon-cherry px-4 py-1.5 rounded-xl text-[12px] font-black shadow-sm border border-white">{tSubs.length} assigned</span>
                   </h3>
                   <div className="p-6 glass-panel border-white/80 interactive-card">
                     <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 max-h-[300px] overflow-y-auto custom-scroll pr-3">
                       {allSubjects.map((sub, idx) => (
                         <label key={sub} className={`flex items-center gap-3 text-[13.5px] font-black cursor-pointer p-4 rounded-[20px] transition-all border-2 animate-slide-up hover:-translate-y-1 ${tSubs.includes(sub) ? 'border-maroon-cherry bg-white text-maroon-deep shadow-sm' : 'border-white/70 bg-white/50 text-maroon-royal hover:bg-white/80 hover:text-maroon-deep'}`} style={{animationDelay: `${0.4 + (idx*0.05)}s`}}>
                           <input type="checkbox" checked={tSubs.includes(sub)} onChange={() => {
                             if(tSubs.includes(sub)) setTSubs(tSubs.filter(s => s !== sub));
                             else setTSubs([...tSubs, sub]);
                           }} className="w-5 h-5 text-maroon-cherry bg-white border border-maroon-royal rounded focus:ring-[#ff4d6d] cursor-pointer" />
                           <span className="truncate">{sub}</span>
                         </label>
                       ))}
                     </div>
                   </div>
                 </div>
                 
                 <div className="flex justify-end pt-6 border-t-2 border-white/60 mt-4 animate-slide-up" style={{animationDelay: '0.6s'}}>
                   <button onClick={handleSaveTeacher} className="btn-contrast px-8 py-3 font-black text-[14px]">Save Settings</button>
                 </div>
               </div>
            </div>
          )
        }
        return null;
      }

      return (
        <div className="min-h-screen p-4 sm:p-6 lg:p-10 flex flex-col items-center relative overflow-hidden">
          <div className="glass-panel w-full max-w-[1200px] overflow-hidden flex flex-col relative z-10 shadow-[0_30px_60px_rgba(94,16,38,0.15)] animate-slide-up">
            <SharedNavbar 
              navLinks={['Manage Subjects', 'Manage Teacher', 'Credentials']}
              activeTab={activeTab} setActiveTab={setActiveTab}
              profileName="System Admin" profileSubtext="Superuser"
              onLogout={onLogout}
            />
            <div className="p-6 sm:p-10 min-h-[600px]">
              {renderContent()}
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [screen, setScreen] = useState('login'); 
      
      const defaultCredentials = { student: { username: 'student', password: 'student123' }, teacher: { username: 'teacher', password: 'teacher123' }, admin: { username: '.\\admin', password: 'Appli@123' } };
      const [credentials, setCredentials] = useState(() => { 
        try { const saved = localStorage.getItem('attendify_creds_v2'); if (saved) return JSON.parse(saved); } catch(e) {} 
        return defaultCredentials; 
      });
      const updateCredentials = (newCredentials) => { 
        setCredentials(newCredentials); 
        localStorage.setItem('attendify_creds_v2', JSON.stringify(newCredentials)); 
      };

      // --- GLOBAL STATE ---
      const defaultGlobalData = {
        semesterSubjects: {
          '1': ['C Language', 'CFOS', 'Web Programming', 'Discrete Mathematics', 'Skill', 'AEC', 'CC'],
          '2': ['C++', 'COA', 'DBMS', 'Skill', 'AEC', 'CC', 'Statistics'],
          '3': ['Java', 'Data Structure', 'CC', 'AEC', 'Maths', 'Skill', 'Field Project'],
          '4': ['Python', 'IPR', 'PHP', 'Digital Media', 'Community Engagement'],
          '5': ['Full Stack', 'Data Communication and Networking', 'OB', 'IKS', 'Cyber Security', 'Skill', 'Data Visualization']
        },
        teacherProfile: {
          name: 'Dr. Aris Sharma',
          department: 'BSc IT & CS',
          assignedSubjects: ['Web Programming', 'DBMS']
        },
        timetable: []
      };
      
      const [globalData, setGlobalData] = useState(() => {
        try { const saved = localStorage.getItem('attendify_global_v1'); if (saved) return JSON.parse(saved); } catch(e) {}
        return defaultGlobalData;
      });

      const updateGlobalData = (newData) => {
        setGlobalData(newData);
        localStorage.setItem('attendify_global_v1', JSON.stringify(newData));
      };
      
      return (
        <>
          <BackgroundGlow />
          {screen === 'login' && <EduTrackLogin onLoginSuccess={setScreen} credentials={credentials} />}
          {screen === 'student' && <StudentDashboard onLogout={() => setScreen('login')} globalData={globalData} />}
          {screen === 'teacher' && <TeacherDashboard onLogout={() => setScreen('login')} globalData={globalData} />}
          {screen === 'admin' && <AdminDashboard onLogout={() => setScreen('login')} credentials={credentials} onUpdateCredentials={updateCredentials} globalData={globalData} onUpdateGlobalData={updateGlobalData} />}
        </>
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { hasError: false, error: null }; }
      static getDerivedStateFromError(error) { return { hasError: true, error }; }
      componentDidCatch(error, info) { console.error("Caught error:", error, info); }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen flex items-center justify-center bg-[#ffd1dc] p-6">
              <div className="glass-panel p-10 max-w-2xl w-full">
                <div className="w-14 h-14 bg-red-100 text-red-600 rounded-[20px] flex items-center justify-center mb-6 border-2 border-red-200"><svg width="28" height="28" fill="none" stroke="currentColor" strokeWidth="3" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div>
                <h1 className="text-[24px] font-black text-maroon-deep mb-2">System Error</h1>
                <p className="text-maroon-royal mb-8 font-bold text-[15px]">A critical error occurred while rendering the page. This is usually caused by outdated data.</p>
                <div className="bg-white/70 border-2 border-white/90 text-red-600 p-5 rounded-[20px] text-[13px] overflow-auto mb-8 custom-scroll max-h-[150px] font-mono shadow-inner font-black">
                  <code>{this.state.error && this.state.error.toString()}</code>
                </div>
                <button onClick={() => { localStorage.clear(); window.location.reload(); }} className="btn-contrast px-8 py-3.5 flex items-center gap-3 text-[14px]">
                  <svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="3" viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                  Reset Dashboard Data
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ErrorBoundary><App /></ErrorBoundary>);
  </script>
</body>
</html>
